# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
skipsdist = True
envlist = flake8, pylint
# Tox does not work if the path to the workdir is too long, so move it to /tmp
toxworkdir = /tmp/{env:USER}_cctox
stxdir = {toxinidir}/../../..

[testenv]
allowlist_externals = find
basepython = python3
commands =
  find . -type f -name "*.pyc" -delete

deps = -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements.txt
       -e{[tox]stxdir}/fault/fm-api/source
       -e{[tox]stxdir}/config/tsconfig/tsconfig
       -e{[tox]stxdir}/config/sysinv/sysinv/sysinv

install_command = pip install \
    --no-cache-dir \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt} \
    {opts} {packages}

[testenv:venv]
commands = {posargs}

[testenv:flake8]
deps = -r{toxinidir}/test-requirements.txt
commands = flake8 {posargs}

[testenv:py39]
basepython = python3.9
commands =
  {[testenv]commands}
  stestr run {posargs}
  stestr slowest

[testenv:pylint]
commands = pylint {posargs} controllerconfig --rcfile=./pylint.rc --extension-pkg-whitelist=netifaces

[flake8]
# H series are hacking
# H101: Use TODO(NAME)
# H102: Apache 2.0 license header not found
# H104: File contains nothing but comments
# H306: imports not in alphabetical order
# H401: docstring should not start with a space
# H404: multi line docstring should start without a leading new line
# H405: multi line docstring summary not separated with an empty line
#
# W504 line break after binary operator
# W605 invalid escape sequence 
ignore = H101,H102,H104,H306,H401,H404,H405,
         W504,W605
exclude = build

[testenv:cover]
basepython = python3.9
commands =
  coverage erase
  python setup.py testr --coverage --testr-args='{posargs}'
  coverage xml
  coverage report

[testenv:coverage]
usedevelop = False
skip_install = True
setenv = VIRTUAL_ENV={envdir}
         PYTHONDONTWRITEBYTECODE=1
deps = -r{toxinidir}/test-requirements.txt
       -r{toxinidir}/requirements.txt
       pytest-cov
       mock
       netaddr
       iso8601
       six
       oslo.config
       oslo.log
       oslo.utils
       psycopg2-binary
       -e{[tox]stxdir}/config/tsconfig/tsconfig
allowlist_externals = {[testenv]allowlist_externals}
                      bash
                      mkdir
commands =
    mkdir -p {toxinidir}/UTCoverage
    find {toxinidir}/controllerconfig/tests -type f -name "*.pyc" -delete
    bash -c "cd /tmp && python -m pytest {toxinidir}/controllerconfig/tests/ \
        --import-mode=importlib \
        --cov=controllerconfig \
        --cov={toxinidir}/scripts \
        --cov-report=term-missing \
        --cov-report=html:{toxinidir}/UTCoverage/htmlcov \
        --cov-report=xml:{toxinidir}/UTCoverage/coverage.xml \
        --cov-config={toxinidir}/.coveragerc \
        -v --tb=short 2>&1 | tee {toxinidir}/UTCoverage/coverage_report.txt"

[trixie]
basepython = python3.13
setenv = VIRTUAL_ENV={envdir}
         PYTHONDONTWRITEBYTECODE=1
         UPPER_CONSTRAINTS_FILE=https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt
install_command = pip install \
    --no-cache-dir \
    -c{env:UPPER_CONSTRAINTS_FILE} \
    {opts} {packages}
usedevelop = False
skip_install = True
deps = -r{toxinidir}/requirements-trixie.txt
       -r{toxinidir}/test-requirements-trixie.txt
       -e{[tox]stxdir}/fault/fm-api/source
       -e{[tox]stxdir}/config/tsconfig/tsconfig

[testenv:flake8-trixie]
basepython = {[trixie]basepython}
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
deps = -r{toxinidir}/test-requirements-trixie.txt
commands =
    # TODO: fix trixie-specific flake8 findings and remove extend-ignore
    flake8 --extend-ignore=F824 {posargs}

[testenv:pylint-trixie]
basepython = {[trixie]basepython}
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
deps = {[trixie]deps}
commands =
    pip install --no-deps sqlalchemy-migrate
    pip install --no-deps -e{[tox]stxdir}/config/sysinv/sysinv/sysinv
    # TODO: fix trixie-specific pylint findings and remove disable
    pylint --disable=E0401,global-variable-not-assigned,possibly-used-before-assignment,raise-missing-from,unspecified-encoding {posargs} controllerconfig --rcfile=./pylint.rc --extension-pkg-whitelist=netifaces

[testenv:coverage-trixie]
basepython = {[trixie]basepython}
usedevelop = False
skip_install = True
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
deps = -r{toxinidir}/test-requirements-trixie.txt
       -r{toxinidir}/requirements-trixie.txt
       pytest-cov
       mock
       netaddr
       iso8601
       six
       oslo.config
       oslo.log
       oslo.utils
       psycopg2-binary
       -e{[tox]stxdir}/config/tsconfig/tsconfig
allowlist_externals = find
                      bash
                      mkdir
commands =
    mkdir -p {toxinidir}/UTCoverage
    find {toxinidir}/controllerconfig/tests -type f -name "*.pyc" -delete
    bash -c "cd /tmp && python -m pytest {toxinidir}/controllerconfig/tests/ \
        --import-mode=importlib \
        --cov=controllerconfig \
        --cov={toxinidir}/scripts \
        --cov-report=term-missing \
        --cov-report=html:{toxinidir}/UTCoverage/htmlcov \
        --cov-report=xml:{toxinidir}/UTCoverage/coverage.xml \
        --cov-config={toxinidir}/.coveragerc \
        -v --tb=short 2>&1 | tee {toxinidir}/UTCoverage/coverage_report.txt"
