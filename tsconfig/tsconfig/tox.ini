[tox]
skipsdist = True
envlist = flake8,py27,py36,py39,pylint,cover
minversion = 2.3.2

[testenv]
basepython = python3
setenv = VIRTUAL_ENV={envdir}
         PYTHONWARNINGS=default::DeprecationWarning
         OS_STDOUT_CAPTURE=1
         OS_STDERR_CAPTURE=1
         OS_TEST_TIMEOUT=60
         OS_TEST_PATH=./tsconfig/tests
usedevelop = True
install_command = pip install {opts} {packages}


deps = -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt}
       -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements.txt

allowlist_externals = find
                      sh

[testenv:stestr]
commands =
  find . -name "*.pyc" -delete
  stestr run {posargs}
  stestr slowest

[testenv:py27]
basepython = python2.7
passenv = CURL_CA_BUNDLE
commands = {[testenv:stestr]commands}

[testenv:py36]
basepython = python3.6
commands = {[testenv:stestr]commands}

[testenv:py39]
basepython = python3.9
deps = -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt}
       -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements.txt
commands = {[testenv:stestr]commands}


[flake8]
# ignore below errors , will fix flake8 errors in future
# H102  Apache 2.0 license header not found
# H306  imports not in alphabetical order
# F401 'XXXXX' imported but unused
show-source = True
#ignore = H102,H306,F401
ignore = H102,H306,F401
exclude = .venv,.git,.tox,dist,doc,*lib/python*,*egg,build,release-tag-*
# TODO: H106 Don't put vim configuration in source files (off by default).
# H203 Use assertIs(Not)None to check for None (off by default).
# TODO: enable: H904 Delay string interpolations at logging calls (off by default).
enable-extensions = H106 H203 H904
max-line-length = 120


[testenv:flake8]
basepython = python3.9
deps = -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt}
       -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements.txt
passenv = CURL_CA_BUNDLE
usedevelop = False
skip_install = True
commands =
    flake8 {posargs} .

[testenv:pylint]
basepython = python3
deps =
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/test-requirements.txt
commands = pylint {posargs} tsconfig --rcfile=./pylint.rc

[testenv:cover]
setenv =
    PYTHON=coverage run --parallel-mode
    PYTHONDONTWRITEBYTECODE=True
commands = coverage erase
           find . -name "*.pyc" -delete
           stestr run {posargs}
           coverage combine
           coverage html -d cover
           coverage xml -o cover/coverage.xml
           coverage report

[testenv:coverage]
setenv = VIRTUAL_ENV={envdir}
         PYTHONDONTWRITEBYTECODE=1
deps = -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements.txt
       pytest-cov
       mock
       six
allowlist_externals = {[testenv]allowlist_externals}
                      bash
                      mkdir
commands =
    mkdir -p {toxinidir}/UTCoverage
    find {toxinidir}/tsconfig/tests -type f -name "*.pyc" -delete
    bash -c "cd /tmp && python -m pytest {toxinidir}/tsconfig/tests/ \
        --import-mode=importlib \
        --cov=tsconfig \
        --cov-report=term-missing \
        --cov-report=html:{toxinidir}/UTCoverage/htmlcov \
        --cov-report=xml:{toxinidir}/UTCoverage/coverage.xml \
        --cov-config={toxinidir}/.coveragerc \
        -v --tb=short 2>&1 | tee {toxinidir}/UTCoverage/coverage_report.txt"

[trixie]
basepython = python3.13
setenv = {[testenv]setenv}
         UPPER_CONSTRAINTS_FILE=https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt
install_command = pip install \
    -c{env:UPPER_CONSTRAINTS_FILE} \
    {opts} {packages}
deps = -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements-trixie.txt

[testenv:py313]
basepython = {[trixie]basepython}
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
deps = {[trixie]deps}
commands = {[testenv:stestr]commands}

[testenv:flake8-trixie]
basepython = {[trixie]basepython}
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
deps = {[trixie]deps}
usedevelop = False
skip_install = True
commands =
    # TODO: fix trixie-specific flake8 findings and remove extend-ignore
    flake8 --extend-ignore=H216 {posargs} .

[testenv:pylint-trixie]
basepython = {[trixie]basepython}
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
deps = -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements-trixie.txt
commands =
    # TODO: fix trixie-specific pylint findings and remove disable
    pylint --disable=deprecated-class,no-member,redundant-u-string-prefix,unspecified-encoding {posargs} tsconfig --rcfile=./pylint.rc

[testenv:coverage-trixie]
basepython = {[trixie]basepython}
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
deps = -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements-trixie.txt
       pytest-cov
       mock
       six
allowlist_externals = {[testenv]allowlist_externals}
                      bash
                      mkdir
commands =
    pip install --no-deps -e .
    mkdir -p {toxinidir}/UTCoverage
    find {toxinidir}/tsconfig/tests -type f -name "*.pyc" -delete
    bash -c "cd /tmp && python -m pytest {toxinidir}/tsconfig/tests/ \
        --import-mode=importlib \
        --cov=tsconfig \
        --cov-report=term-missing \
        --cov-report=html:{toxinidir}/UTCoverage/htmlcov \
        --cov-report=xml:{toxinidir}/UTCoverage/coverage.xml \
        --cov-config={toxinidir}/.coveragerc \
        -v --tb=short 2>&1 | tee {toxinidir}/UTCoverage/coverage_report.txt"
